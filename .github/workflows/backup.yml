# ============================================================
# BACKUP AUTOMÁTICO DIARIO — 06:23 UTC (~1-2am hora Carolina del Sur)
# Descarga el ZIP completo del sistema (datos tech + finance + binarios)
# y lo guarda como artifact de GitHub con 90 días de retención.
# Requiere el secret APP_PASSWORD en GitHub → Settings → Secrets → Actions.
# También se puede disparar manualmente: Actions → Backup diario → Run workflow.
# ============================================================
name: Backup diario

on:
  schedule:
    # Minuto 23 a propósito: el minuto 0 es el más congestionado de GitHub y los
    # runs programados estaban aterrizando 7-8 horas tarde (06:00 UTC pedido,
    # 13:00-14:30 UTC real). Un minuto impar sale de esa cola.
    - cron: "23 6 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Login y descarga del backup
        run: |
          set -e
          echo "Obteniendo token..."
          TOKEN=$(curl -sf -X POST https://restrepoacosta.onrender.com/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"${{ secrets.APP_PASSWORD }}\"}" | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          echo "Descargando backup completo (puede tardar)..."
          curl -sf -o backup-$(date +%Y%m%d).zip \
            -H "Authorization: Bearer $TOKEN" \
            --max-time 900 \
            https://restrepoacosta.onrender.com/api/backup
          ls -lh backup-*.zip
          # Verificación mínima: el ZIP no puede estar vacío ni ser un error JSON
          SIZE=$(stat -c%s backup-*.zip)
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::El backup pesa menos de 10KB — probablemente falló. Revisar."
            exit 1
          fi
      - name: Guardar como artifact (90 días de retención)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup-*.zip
          retention-days: 90

  # ============================================================
  # KEEPALIVE — por qué existe
  # GitHub apaga los workflows programados de los repos PÚBLICOS cuando el repo
  # pasa 60 días sin actividad. Ocurrió el 8-nov-2026: el último push fue el
  # 8-sep-2026 y el backup quedó en `disabled_inactivity` sin aviso visible.
  # Este job empuja un commit vacío cuando el repo se acerca al límite, lo que
  # reinicia el contador. Corre aparte del backup (no `needs:`) para que siga
  # protegiendo aunque el backup falle.
  # ============================================================
  keepalive:
    name: Keepalive — evitar que GitHub apague el schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit vacío si el repo lleva más de 45 días quieto
        run: |
          set -e
          DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Último commit hace ${DAYS} día(s). GitHub apaga el schedule a los 60."
          if [ "$DAYS" -lt 45 ]; then
            echo "Nada que hacer: el contador está lejos del límite."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(keepalive): actividad para que GitHub no apague el backup programado"
          git push
          echo "✓ Contador de inactividad reiniciado."
