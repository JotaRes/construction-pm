# ============================================================
# CI — se ejecuta en cada push a main y en cada Pull Request.
# Verifica lo que antes dependía de memoria humana (regla de oro #3):
#   1. Que el schema Prisma tenga provider postgresql (nunca sqlite)
#   2. Que el backend compile sin errores (tsc --noEmit)
#   3. Que el frontend compile y buildee sin errores
# Si algo falla, GitHub marca el commit con ❌ — revisar antes de confiar
# en ese deploy (Render deploya en paralelo; el CI es tu señal de alarma).
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-schema:
    name: Guard — provider postgresql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el provider NO es sqlite
        run: |
          if grep -q 'provider = "sqlite"' backend/prisma/schema.prisma; then
            echo "::error::schema.prisma tiene provider sqlite — esto ROMPE producción. Cambiar a postgresql."
            exit 1
          fi
          echo "✓ provider postgresql confirmado"
      - name: Verificar que no hay secretos hardcodeados
        run: |
          # Patrones partidos en dos para que este archivo no se detecte a sí mismo
          P1="1841""8598"; P2="construction""2024"; P3="construction-pm-""secret"
          if grep -rn "$P1\|$P2\|$P3" --include="*.ts" --include="*.tsx" --include="*.yaml" --include="*.yml" backend/src frontend/src render.yaml; then
            echo "::error::Se detectaron credenciales hardcodeadas en el código."
            exit 1
          fi
          echo "✓ sin credenciales hardcodeadas"

  backend:
    name: Backend — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      # Red de seguridad de LÓGICA: corre la suite pura (matching de draws,
      # parsers de HUD/extractos/Excel) — sin base de datos, apta para CI.
      # Si un cambio rompe el parseo o el matcher, el push queda en ❌.
      - name: Tests de lógica (suite pura)
        run: npm run test:pure
        working-directory: backend

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  tests:
    name: Backend — suite de tests (lógica + BD)
    runs-on: ubuntu-latest
    # Postgres efímero solo para esta corrida. Los tests con BD se autoabastecen
    # de fixtures y limpian tras de sí; nunca tocan datos reales.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restrepoacosta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restrepoacosta_test
      # Valores de prueba (no son secretos de producción). Algunos módulos leen
      # estas vars al importarse; los tests no autentican contra ellas.
      JWT_SECRET: ci-test-secret
      APP_PASSWORD: ci-test-password
      WIPE_PASSWORD: ci-test-wipe
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - name: Aplicar migraciones a la BD de prueba
        run: npx prisma migrate deploy
        working-directory: backend
      - name: Ejecutar suite completa (lógica pura + tests con BD)
        run: npm run test:all
        working-directory: backend
